<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#heartGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Stylized Heart Outline / Embracing Arms -->
    <path d="M256 420 C 120 330, 80 230, 130 140 C 170 70, 240 100, 256 140 C 272 100, 342 70, 382 140 C 432 230, 392 330, 256 420 Z" 
          fill="url(#heartGrad)" opacity="0.95"/>
    
    <!-- Mother and Baby Inner Silhouette -->
    <!-- Mother Head -->
    <circle cx="216" cy="180" r="28" fill="#ffffff"/>
    <!-- Mother Body / Curve -->
    <path d="M190 280 C 180 230, 210 215, 235 225 C 250 230, 260 250, 240 290 Z" fill="#ffffff"/>
    
    <!-- Baby Head (Gold Accent) -->
    <circle cx="280" cy="225" r="20" fill="url(#goldGrad)"/>
    <!-- Baby Body / Hug -->
    <path d="M260 250 C 275 235, 305 245, 295 275 C 285 295, 265 285, 260 250 Z" fill="url(#goldGrad)"/>
    
    <!-- Small Caring Sparkle -->
    <path d="M350 160 L354 172 L366 176 L354 180 L350 192 L346 180 L334 176 L346 172 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
