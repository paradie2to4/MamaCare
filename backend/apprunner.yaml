version: 1.0
runtime: nodejs18
build:
  commands:
    build:
      - npm ci
      - npx prisma generate
      - npm run build
run:
  command: npx prisma migrate deploy && node dist/main.js
  network:
    port: 3000
  # Secrets and config (DATABASE_URL, JWT_*, CORS_ORIGIN, etc.) are set as this App Runner
  # service's runtime environment variables via the console/CLI — never committed here.
